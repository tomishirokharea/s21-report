<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>野外奉仕報告</title>
<style>
  :root { --blue:#2f5d9b; --navy:#1b3a63; --line:#d7dde6; --bg:#f4f6f9; --gray:#6b7684; --ok:#1f7a3a; --warn:#b26a00; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; color:#1f2a37; font-size:16px; line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:16px 14px 60px; }
  .wide { max-width:900px; }
  h1 { font-size:20px; margin:4px 0 10px; text-align:center; }
  .sub { text-align:center; color:var(--gray); font-size:13px; margin-bottom:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; border:1px solid #333; padding:10px 12px; margin-top:-1px; background:#fff; }
  .row .lab { flex:1; font-size:15px; }
  .row input[type=number] { width:64px; height:40px; font-size:18px; text-align:center; border:1px solid #333; border-radius:4px; }
  .row.disabled { color:#aaa; }
  .field { display:flex; align-items:baseline; gap:8px; margin:4px 0 8px; }
  .field b { white-space:nowrap; }
  .field .v { flex:1; border-bottom:1px dotted #333; padding:2px 4px; font-size:17px; }
  select, input[type=text], textarea { width:100%; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:6px; }
  textarea { height:72px; }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:14px; font-size:17px; font-weight:bold; margin-top:12px; cursor:pointer; }
  .btn.sec { background:#e9eff7; color:var(--navy); }
  .btn.sm { display:inline-block; width:auto; padding:8px 14px; font-size:14px; margin:4px 4px 0 0; }
  .btn:disabled { opacity:.5; }
  .chk { width:44px; height:44px; border:2px solid #333; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; user-select:none; background:#fff; flex-shrink:0; }
  .chk.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .tg { width:46px; height:28px; border-radius:14px; background:#c9d3e0; position:relative; cursor:pointer; flex-shrink:0; }
  .tg::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  .tg.on { background:var(--blue); } .tg.on::after { left:21px; }
  .msg { padding:10px 12px; border-radius:8px; margin:10px 0; font-size:14px; }
  .msg.ok { background:#eaf6ec; color:var(--ok); } .msg.err { background:#fdecea; color:var(--err); } .msg.warn { background:#fff5e0; color:var(--warn); }
  .muted { color:var(--gray); font-size:13px; }
  .hist { width:100%; border-collapse:collapse; font-size:13px; }
  .hist td, .hist th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:center; }
  /* overseer list */
  .wrap.ov { max-width:680px; }
  .ovtop { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; align-items:end; }
  .ovtop label { font-size:12px; color:var(--gray); display:block; }
  .ovtop .fixed { font-size:16px; padding:8px 0; color:#1f2a37; }
  table.gsum { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  table.gsum td, table.gsum th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:center; }
  table.gsum th { font-size:11px; color:var(--gray); font-weight:normal; }
  table.gsum td.l { text-align:left; }
  table.gsum tr.mine td { background:#eef4fc; }
  table.gsum tr.g { cursor:pointer; }
  table.gsum .ovs { font-size:11px; color:var(--gray); }
  .unsub { color:var(--err); font-weight:bold; } .alldone { color:var(--ok); font-weight:bold; }
  details.grp { padding:0; overflow:hidden; }
  details.grp > summary { list-style:none; padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  details.grp > summary::-webkit-details-marker { display:none; }
  details.grp > summary::before { content:"▸"; color:var(--blue); }
  details.grp[open] > summary::before { content:"▾"; }
  details.grp > summary .gname { font-size:17px; }
  details.grp > summary .gcount { margin-left:auto; font-size:13px; font-weight:normal; }
  details.grp .gbody { padding:0 10px 12px; }
  .mem { padding:8px 4px; border-bottom:1px solid var(--line); }
  .mem .l1 { display:grid; grid-template-columns:1fr 46px 56px 46px 56px; gap:6px; align-items:center; }
  .mem .l2 { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .mem .l2 input[data-f=remarks] { flex:1; min-width:0; height:36px; font-size:15px; text-align:left; padding:0 8px; }
  .mem .l2 .cr { display:flex; align-items:center; gap:3px; font-size:13px; color:var(--navy); white-space:nowrap; }
  .mem .l2 .cr input { width:56px; height:36px; }
  .mem .act { font-size:11px; color:var(--warn); }
  .memh { display:grid; grid-template-columns:1fr 46px 56px 46px 56px; gap:6px; font-size:11px; color:var(--gray); border-bottom:2px solid var(--blue); padding:4px; }
  .memh span { text-align:center; } .memh span:first-child { text-align:left; }
  .mem .nm { font-size:15px; overflow:hidden; line-height:1.3; }
  .mem.own { background:#f3f5f8; } .mem.own .l1 { color:#9aa5b5; } .mem.own .l1 .tg { opacity:.5; pointer-events:none; } .mem.own .l1 input, .mem.own input[data-f=remarks] { color:#9aa5b5; background:#f3f5f8; }
  .mem.inactive .nm { color:#b5bcc8; }
  .mem input { width:100%; height:38px; font-size:16px; text-align:center; border:1px solid #9aa5b5; border-radius:5px; }
  .mem input:disabled { background:#f3f5f8; }
  .onlyUnsub .mem.has { display:none; }
  .pill { display:inline-block; font-size:10px; background:#e9eff7; color:var(--navy); border-radius:8px; padding:0 6px; margin-left:4px; vertical-align:middle; }
  .pill.warn { background:#fff5e0; color:var(--warn); } .pill.ok { background:#eaf6ec; color:var(--ok); }
  /* secretary */
  .sec-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px) { .sec-grid { grid-template-columns:1fr; } }
  .kv { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .kv .k { flex:1; color:#4a5566; font-size:14px; }
  .kv .v { min-width:70px; text-align:right; font-weight:bold; font-size:18px; border:1px solid #9aa5b5; border-radius:5px; padding:4px 8px; background:#f8fafc; }
  .kv .cp { font-size:12px; border:1px solid var(--blue); color:var(--blue); background:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; }
  .kv .cp.done { background:var(--blue); color:#fff; }
  h3 { font-size:15px; color:var(--navy); margin:0 0 6px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:14px; }
  .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .credit input { width:70px; height:36px; font-size:16px; text-align:center; }
  code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:13px; }
  /* visit dashboard */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .tile .n { font-size:24px; font-weight:bold; color:var(--navy); line-height:1.1; }
  .tile .l { font-size:12px; color:var(--gray); }
  .tile .d { font-size:12px; } .up { color:var(--ok); } .down { color:var(--err); }
  .chart { width:100%; height:auto; }
  .att { display:flex; flex-wrap:wrap; gap:6px; }
  .att span { background:#eef1f5; border-radius:14px; padding:4px 10px; font-size:14px; }
  .att span small { color:var(--gray); }
  table.v { width:100%; border-collapse:collapse; font-size:12px; }
  table.v th, table.v td { border:1px solid var(--line); padding:3px 4px; text-align:center; white-space:nowrap; }
  table.v th { background:#e9eff7; }
  table.v td.l { text-align:left; }
  .bar { height:8px; background:#e9eff7; border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--blue); }
  details { margin:6px 0; } summary { cursor:pointer; font-weight:bold; color:var(--navy); }
  .ro { font-size:12px; color:var(--gray); text-align:center; margin:8px 0; }
  @media print { .noprint, .tabs, h1, .sub, #toast { display:none !important; } body { background:#fff; } .card { border:none; } #tab-pioneer { display:block !important; } #tab-hub, #tab-check, #tab-pdf, #tab-setup { display:none !important; } }
  #toast { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:20; width:calc(100% - 32px); max-width:600px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  #loading { position:fixed; inset:0; background:rgba(255,255,255,.6); display:none; align-items:center; justify-content:center; font-weight:bold; color:var(--navy); }
</style>
</head>
<body>
<div id="loading">読み込み中…</div>
<div class="wrap" id="app"></div>
<script>
// ------------------------------------------------------------
// 共通
// ------------------------------------------------------------
const Q = Object.fromEntries(new URLSearchParams(location.search));
let API = Q.api || localStorage.getItem('s21_api') || '';
if (Q.api) try { localStorage.setItem('s21_api', Q.api); } catch (e) {}
const TOKEN = Q.t || '';
const MODE = Q.mode || 'personal';
const app = document.getElementById('app');
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function ymLabel(ym) { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; }
function ymAdd(ym, d) { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + d; return Math.floor(t / 12) + '-' + ('0' + ((t % 12) + 1)).slice(-2); }
function loading(on) { $('#loading').style.display = on ? 'flex' : 'none'; }
async function call(payload) {
  if (!API) throw new Error('接続先(api)が指定されていません。配布されたURLから開いてください。');
  loading(true);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ t: TOKEN }, payload)), redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j;
  } finally { loading(false); }
}
function toast(text, kind) {
  let m = $('#toast'); if (!m) { m = document.createElement('div'); m.id = 'toast'; app.prepend(m); }
  m.className = 'msg ' + (kind || 'ok'); m.textContent = text; m.style.display = 'block';
  clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 4000);
}
function showError(e) { app.innerHTML = '<div class="card"><div class="msg err">' + esc(e.message || e) + '</div></div>'; }

// ------------------------------------------------------------
// 個人用フォーム（S-4）
// ------------------------------------------------------------
async function renderPersonal(ym) {
  const d = await call({ action: 'me', ym });
  const p = d.person, r = d.report || {};
  const opts = []; for (let i = 0; i < 4; i++) { const y = ymAdd(d.ym, 1 - i); opts.push(y); }
  if (!opts.includes(d.ym)) opts.unshift(d.ym);
  app.innerHTML = `
  <h1>野外奉仕報告</h1>
  <div class="sub">${esc(d.congregation)}</div>
  <div class="card">
    <div class="field"><b>氏名:</b><div class="v">${esc(p.name)}</div></div>
    <div class="field"><b>月:</b><div class="v" style="border:none;padding:0"><select id="ym">${opts.map(y => `<option value="${y}" ${y === d.ym ? 'selected' : ''}>${ymLabel(y)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="lab">1カ月間に何らかの形で伝道したならチェックを入れてください</div><div class="chk ${r.preached ? 'on' : ''}" id="preached">${r.preached ? '✓' : ''}</div></div>
    <div class="row"><div class="lab">司会した<b>個別の</b>聖書研究の数</div><input type="number" id="studies" inputmode="numeric" min="0" value="${r.studies ?? ''}"></div>
    <div class="row ${p.pioneer ? '' : ''}"><div class="lab">補助開拓者として奉仕した</div><div class="tg ${r.aux ? 'on' : ''}" id="aux"></div></div>
    <div class="row ${p.pioneer || r.aux ? '' : 'disabled'}" id="hoursRow"><div class="lab">時間<br><span class="muted">（補助開拓者, 正規開拓者, 特別開拓者, 野外の宣教者は記入してください）</span></div><input type="number" id="hours" inputmode="numeric" min="0" value="${r.hours || ''}" ${p.pioneer || r.aux ? '' : 'disabled'}></div>
    ${p.pioneer ? `<div class="row"><div class="lab">承認された活動の時間<br><span class="muted">（LDC等。任意。報告には含まれず備考に記録）</span></div><input type="number" id="actHours" inputmode="numeric" min="0" value="${r.actHours || ''}"></div>` : ''}
    <div class="row" style="display:block"><div class="lab">備考:</div><textarea id="remarks">${esc(r.remarks || '')}</textarea></div>
    ${r.submitted ? `<div class="muted" style="margin-top:8px">提出済み: ${esc(r.submitted)}（${r.source === 'overseer' ? '監督入力' : r.source === 'import' ? '取込' : '本人'}）。送信すると上書きされます。</div>` : ''}
    <button class="btn" id="send">送信</button>
    <div class="muted" style="text-align:center;margin-top:8px">S-4-J 11/23 と同じ項目です</div>
  </div>
  <div class="card"><h3>最近の報告</h3><table class="hist"><tr><th>月</th><th>伝道</th><th>研究</th><th>補助</th><th>時間</th></tr>
  ${d.recent.slice(1, 7).map(x => `<tr><td>${ymLabel(x.ym)}</td><td>${x.empty ? '—' : x.preached ? '✓' : ''}</td><td>${x.empty ? '' : x.studies || ''}</td><td>${x.empty ? '' : x.aux ? '✓' : ''}</td><td>${x.empty ? '' : x.hours || ''}</td></tr>`).join('')}</table></div>`;
  $('#ym').onchange = (e) => renderPersonal(e.target.value);
  $('#preached').onclick = (e) => { e.target.classList.toggle('on'); e.target.textContent = e.target.classList.contains('on') ? '✓' : ''; };
  $('#aux').onclick = (e) => { e.target.classList.toggle('on'); const on = e.target.classList.contains('on') || p.pioneer; $('#hours').disabled = !on; $('#hoursRow').classList.toggle('disabled', !on); };
  $('#send').onclick = async () => {
    const payload = { action: 'submit', ym: $('#ym').value, preached: $('#preached').classList.contains('on'), studies: $('#studies').value || 0, aux: $('#aux').classList.contains('on'), hours: $('#hours').value || 0, actHours: ($('#actHours') || {}).value || 0, remarks: $('#remarks').value, source: 's4' };
    if (!payload.preached && !(Number(payload.hours) > 0) && !(Number(payload.studies) > 0)) { if (!confirm('「伝道した」にチェックがありません。このまま送信しますか？')) return; }
    try { const res = await call(payload); await renderPersonal(payload.ym); toast(ymLabel(payload.ym) + ' の報告を送信しました' + (res.late ? '（締切後のため翌月の会衆報告に加算されます）' : ''), res.late ? 'warn' : 'ok'); }
    catch (e) { toast(e.message, 'err'); }
  };
}

// ------------------------------------------------------------
// 監督用フォーム（全グループを1画面に。共通URL・監督個人のURL・書記のURLで開ける）
// ------------------------------------------------------------
const OV_BY_KEY = 's21_ov_by';
const stripTag = (s) => String(s || '').replace(/\s*承認活動\s*\d+h（うち加算\s*\d+h）/g, '').replace(/\s*［加算\s*\d+h］/g, '').trim();
const isOwn = (r) => !!r && (r.source === 's4' || r.source === 'map');
let OV = null;

async function renderOverseer(ym) {
  app.classList.add('ov');
  const d = await call({ action: 'overseer', ym });
  let saved = ''; try { saved = localStorage.getItem(OV_BY_KEY) || ''; } catch (e) {}
  const byId = d.me ? d.me.id : (d.overseers.some(o => o.id === saved) ? saved : '');
  OV = { d, ym: d.ym, byId };
  const myGroup = () => { if (d.me) return d.me.group; const o = d.overseers.find(x => x.id === OV.byId); return o ? o.group : ''; };
  const opts = [ymAdd(d.ym, 1), d.ym, ymAdd(d.ym, -1), ymAdd(d.ym, -2)];
  const byGroups = [...new Set(d.overseers.map(o => o.group))];
  app.innerHTML = `
  <h1>野外奉仕報告　監督用</h1>
  <div class="sub">${esc(d.congregation)}　全グループ</div>
  <div class="card">
    <div class="ovtop">
      <div><label>月</label><select id="ym">${opts.map(y => `<option value="${y}" ${y === d.ym ? 'selected' : ''}>${ymLabel(y)}</option>`).join('')}</select></div>
      <div><label>入力する人</label>${d.me ? `<div class="fixed">${esc(d.me.name)}</div>` :
        `<select id="by"><option value="">選んでください</option>${byGroups.map(g => `<optgroup label="${esc(g || '（グループなし）')}">${d.overseers.filter(o => o.group === g).map(o => `<option value="${esc(o.id)}" ${o.id === byId ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</optgroup>`).join('')}</select>`}</div>
    </div>
    <div class="msg warn" id="needBy" style="display:${OV.byId ? 'none' : 'block'}">はじめに「入力する人」で自分の名前を選んでください（この端末に記憶されます）。</div>
    <h3 style="margin-top:12px">グループの状況 <span class="muted" id="totalCount"></span></h3>
    <table class="gsum"><tr><th style="text-align:left">グループ</th><th>提出</th><th>未提出</th><th>月締め</th></tr>
      ${d.groups.map((g, gi) => `<tr class="g" data-gi="${gi}" id="gs-${gi}"><td class="l">${esc(g.group)}<div class="ovs">${g.overseers.map(esc).join('・')}</div></td><td class="gsub"></td><td class="gun"></td><td class="gcl"></td></tr>`).join('')}
    </table>
    <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:14px"><input type="checkbox" id="onlyUnsub" style="width:20px;height:20px"> 未提出の人だけ表示する</label>
  </div>
  <div id="groups">
  ${d.groups.map((g, gi) => `
    <details class="card grp" id="g-${gi}">
      <summary><b class="gname">${esc(g.group)}</b><span class="muted">${g.overseers.map(esc).join('・')}</span><span class="gcount" id="gh-${gi}"></span></summary>
      <div class="gbody">
        <div class="memh"><span>氏名</span><span>伝道</span><span>研究</span><span>補助</span><span>時間</span></div>
        ${g.members.map(m => memberRow(m)).join('')}
        <div class="msg warn" id="gu-${gi}"></div>
        <button class="btn sec" data-close="${gi}">${esc(g.group)}の月締め完了</button>
      </div>
    </details>`).join('')}
  </div>
  <div class="card muted">
    ・1行入力するごとに自動保存されます（保存した行は一瞬緑色になります）。<br>
    ・グレーの行は本人がWEBで提出したものです。数字と備考は変えられませんが、開拓者の<b>加算時間</b>は入力できます。<br>
    ・<b>加算時間</b>（開拓者のみ）：承認された活動のうち加算できる時間。野外奉仕と合わせて月${d.cap}時間までです。報告の時間には含まれず、S-21の備考に記録されます。開拓者学校などの学校の時間は上限とは別なので、備考に「開拓者学校30h」のように書いてください。<br>
    ・不活発の人は各グループの最後に薄く表示されます。報告があれば入力できます。
  </div>`;

  // 開くグループ: 自分のグループ（入力する人のグループ）
  const openMine = () => { const mg = myGroup(); d.groups.forEach((g, gi) => { $('#gs-' + gi).classList.toggle('mine', g.group === mg); if (g.group === mg) $('#g-' + gi).open = true; }); };
  openMine();
  d.groups.forEach((g, gi) => updateGroupCounts(gi));
  $('#ym').onchange = (e) => renderOverseer(e.target.value);
  if ($('#by')) $('#by').onchange = (e) => { OV.byId = e.target.value; try { localStorage.setItem(OV_BY_KEY, OV.byId); } catch (er) {} $('#needBy').style.display = OV.byId ? 'none' : 'block'; openMine(); };
  $('#onlyUnsub').onchange = (e) => $('#groups').classList.toggle('onlyUnsub', e.target.checked);
  document.querySelectorAll('tr.g').forEach(tr => tr.onclick = () => { const el = $('#g-' + tr.dataset.gi); el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => {
    const gi = Number(b.dataset.close), g = d.groups[gi];
    if (needBy()) return;
    if (g.unsubmitted.length && !confirm(g.group + ' にはまだ未提出の人が ' + g.unsubmitted.length + ' 名います。月締めにしますか？')) return;
    try { const r = await call({ action: 'closeMonth', ym: OV.ym, group: g.group, by: OV.byId }); g.closed = r.closed; updateGroupCounts(gi); toast(g.group + ' の月締めを記録しました'); } catch (e) { toast(e.message, 'err'); }
  });
  d.groups.forEach((g, gi) => g.members.forEach(m => bindMember(m, gi)));
}
function needBy() {
  if (OV.byId) return false;
  toast('はじめに「入力する人」で自分の名前を選んでください', 'err');
  const sel = $('#by'); if (sel) { sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); sel.focus(); }
  return true;
}
function updateGroupCounts(gi) {
  const g = OV.d.groups[gi];
  const act = g.members.filter(m => m.active);
  g.submitted = act.filter(m => m.report).length;
  g.unsubmitted = act.filter(m => !m.report).map(m => m.name);
  const tr = $('#gs-' + gi);
  $('.gsub', tr).textContent = g.submitted + ' / ' + act.length;
  $('.gun', tr).innerHTML = g.unsubmitted.length ? `<span class="unsub">${g.unsubmitted.length}名</span>` : '<span class="alldone">0</span>';
  $('.gcl', tr).innerHTML = g.closed ? `<span class="pill ok">済</span><div class="ovs">${esc(g.closed.by)}</div>` : '';
  $('#gh-' + gi).innerHTML = (g.closed ? '<span class="pill ok">月締め済</span> ' : '') + (g.unsubmitted.length ? `未提出 <span class="unsub">${g.unsubmitted.length}</span>` : '<span class="alldone">全員提出</span>');
  const u = $('#gu-' + gi);
  u.className = 'msg ' + (g.unsubmitted.length ? 'warn' : 'ok');
  u.innerHTML = g.unsubmitted.length ? `未提出 <b>${g.unsubmitted.length}名</b>（${g.unsubmitted.map(esc).join('・')}）` : '活発な人は全員提出済みです' + (g.closed ? `（月締め: ${esc(g.closed.by)} ${esc(g.closed.at)}）` : '');
  const all = OV.d.groups.reduce((a, x) => [a[0] + x.members.filter(m => m.active && m.report).length, a[1] + x.members.filter(m => m.active).length], [0, 0]);
  $('#totalCount').textContent = '全体 ' + all[0] + ' / ' + all[1] + ' 名提出';
}
function rowStatus(m) {
  const r = m.report;
  if (isOwn(r)) return '<span class="pill">本人提出</span>';
  if (r && r.source === 'overseer') return '<span class="pill ok">入力済</span>';
  if (r) return '<span class="pill">' + (r.source === 'import' ? '取込' : '入力済') + '</span>';
  return '';
}
function memberRow(m) {
  const r = m.report || {};
  const own = isOwn(m.report);
  const cls = [own ? 'own' : '', !m.active ? 'inactive' : '', m.report ? 'has' : ''].join(' ');
  const warn = m.active && !m.report && m.monthsWithout >= 4 ? `<span class="pill warn">${6 - m.monthsWithout}カ月で不活発</span>` : '';
  const kind = m.rp ? '正規' : m.sp ? '特別' : m.fm ? '宣教者' : '';
  return `<div class="mem ${cls}" id="m-${m.id}">
    <div class="l1">
      <div class="nm">${esc(m.name)}${kind ? `<span class="pill">${kind}</span>` : ''}${!m.active ? '<span class="pill">不活発</span>' : ''}<span class="st">${rowStatus(m)}</span>${warn}</div>
      <div class="tg ${r.preached ? 'on' : ''}" data-f="preached"></div>
      <input type="number" inputmode="numeric" min="0" data-f="studies" value="${r.studies || ''}" ${own ? 'disabled' : ''}>
      <div class="tg ${r.aux ? 'on' : ''}" data-f="aux"></div>
      <input type="number" inputmode="numeric" min="0" data-f="hours" value="${r.hours || ''}" ${own || !(m.pioneer || r.aux) ? 'disabled' : ''}>
    </div>
    <div class="l2">
      <input type="text" data-f="remarks" placeholder="備考" maxlength="180" value="${esc(stripTag(r.remarks))}" ${own ? 'disabled' : ''}>
      ${m.pioneer ? `<span class="cr">加算<input type="number" inputmode="numeric" min="0" data-f="credit" value="${r.credit || ''}">h</span>` : ''}
    </div>
    ${m.pioneer && r.actHours ? `<div class="act">本人の報告：承認された活動 ${r.actHours}時間</div>` : ''}
  </div>`;
}
function bindMember(m, gi) {
  const el = $('#m-' + m.id); if (!el) return;
  const f = (k) => $('[data-f=' + k + ']', el);
  const own = isOwn(m.report);
  const flash = () => { el.style.background = '#eaf6ec'; setTimeout(() => el.style.background = '', 700); };
  const after = (report) => {
    m.report = report; el.classList.add('has'); $('.st', el).innerHTML = rowStatus(m);
    const w = $('.pill.warn', el); if (w) w.remove();
    updateGroupCounts(gi); flash();
  };
  const capMsg = (res) => { if (res.capped) toast(`野外奉仕と加算時間は合わせて月${res.cap}時間までのため、加算を${res.credit ?? res.report.credit}時間にしました`, 'warn'); };
  const save = async () => {
    if (own || needBy()) return;
    const payload = { action: 'overseerSubmit', by: OV.byId, id: m.id, ym: OV.ym,
      preached: f('preached').classList.contains('on'), studies: f('studies').value || 0,
      aux: f('aux').classList.contains('on'), hours: f('hours').value || 0, remarks: f('remarks').value };
    if (f('credit')) payload.credit = f('credit').value;
    const empty = !payload.preached && !(Number(payload.studies) > 0) && !payload.aux && !(Number(payload.hours) > 0) && !payload.remarks.trim() && !(Number(payload.credit) > 0);
    if (!m.report && empty) return;
    try {
      const res = await call(payload);
      if (f('credit')) f('credit').value = res.report.credit || '';
      after(res.report); capMsg(res);
    } catch (e) { toast(m.name + '：' + e.message, 'err'); }
  };
  el.querySelectorAll('.l1 .tg').forEach(t => t.onclick = () => {
    if (own) return;
    t.classList.toggle('on');
    if (t.dataset.f === 'aux') f('hours').disabled = !(m.pioneer || t.classList.contains('on'));
    save();
  });
  ['studies', 'hours', 'remarks'].forEach(k => f(k).onchange = save);
  if (f('credit')) f('credit').onchange = async () => {
    if (!own) return save();
    if (needBy()) return;
    try {
      const res = await call({ action: 'overseerCredit', by: OV.byId, id: m.id, ym: OV.ym, credit: f('credit').value || 0 });
      f('credit').value = res.credit || ''; m.report.credit = res.credit; m.report.remarks = res.remarks;
      flash(); capMsg(res);
    } catch (e) { toast(m.name + '：' + e.message, 'err'); }
  };
}

function initPioneer(curYm) {
  const sel = $('#prTo'); const opts = []; for (let i = 0; i < 24; i++) opts.push(ymAdd(curYm, -i));
  sel.innerHTML = opts.map(y => `<option value="${y}">${ymLabel(y)}</option>`).join('');
  const sy = (ym) => { const [y, m] = ym.split('-').map(Number); return m >= 9 ? y + 1 : y; };
  // 「3月」「7月」ボタン：まだ来ていない期間なら前の年度を見る
  const pick = (m) => { let y = sy(curYm); let t = y + '-' + ('0' + m).slice(-2); if (t > curYm) t = (y - 1) + '-' + ('0' + m).slice(-2); return t; };
  document.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => showPioneer(b.dataset.pr === 'mar' ? pick(2) : pick(7)));
  $('#prGo').onclick = () => showPioneer(sel.value);
}

    out.innerHTML = `

          ${d.remainingMonths ? '<td>' + (r.needPerMonth === null ? '' : '月 ' + r.needPerMonth + 'h') + '</td>' : ''}</tr>`).join('')}
      </table></div>
      <div class="muted" style="margin-top:6px">数字＝野外奉仕の時間、<small>+数字</small>＝確定した加算時間、<span style="color:#b3261e">未</span>＝報告なし（0時間として計算）、<span style="color:#b26a00">橙色</span>＝その月が${d.goal}時間未満。<br>
      月数は奉仕年度の始めから（年度の途中で任命された人は、補助開拓ではない時間の報告が最初にある月から。灰色の数字はそれより前の月）。「残り月の目安」＝年間の目安（月${d.goal}時間×開拓奉仕をする月数。通年なら${d.yearlyGoal}時間）に届くために、残り${d.remainingMonths}カ月で必要な1カ月あたりの時間。<br>
      「加算未確定」の月は、確認事項タブで加算時間を確定してから見直してください。</div>
      <button class="btn sec noprint" onclick="window.print()">この表を印刷する</button>
    </div>`;
  } catch (e) { toast(e.message, 'err'); }
}

// 巡回訪問ダッシュボード（閲覧専用）
// ------------------------------------------------------------
function lineChart(series, labels, opts) {
  // series: [{name, values:[...], color}] ; simple inline SVG
  const W = 600, H = 180, P = { l: 34, r: 8, t: 10, b: 24 };
  const all = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!all.length) return '<div class="muted">データなし</div>';
  let max = Math.max(...all), min = (opts && opts.zero) ? 0 : Math.min(...all);
  if (max === min) { max += 1; min = Math.max(0, min - 1); }
  const x = (i) => P.l + (W - P.l - P.r) * (labels.length <= 1 ? 0 : i / (labels.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = min + (max - min) * f; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ed"/><text x="${P.l - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#6b7684">${Math.round(v)}</text>`; });
  labels.forEach((l, i) => { if (i % Math.ceil(labels.length / 8) === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#6b7684">${l.slice(2).replace('-', '/')}</text>`; });
  series.forEach(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.values.forEach((v, i) => { if (v !== null && v !== undefined) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${s.color}"/>`; });
  });
  const legend = series.map(s => `<span style="color:${s.color};font-size:12px;margin-right:10px">● ${esc(s.name)}</span>`).join('');
  return `<div>${legend}</div><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function dlt(a, b, unit) { if (a === null || b === null || a === undefined || b === undefined) return ''; const d = Math.round((b - a) * 10) / 10; return `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}${unit || ''}</span>`; }

  const att = d.attention;
  const attBlock = (title, arr, fmt) => arr && arr.length ? `<details open><summary>${title}（${arr.length}）</summary><div class="att">${arr.map(x => `<span>${esc(x.name)} <small>${esc(x.group || '')}${fmt ? ' ' + fmt(x) : ''}</small></span>`).join('')}</div></details>` : '';
  const monthsHdr = (sy) => { const out = []; for (let i = 0; i < 12; i++) out.push(((8 + i) % 12) + 1); return out; };
  const cellTxt = (c, cat) => c ? ((c.p ? '✓' : '') + (c.s ? ' ' + c.s : '') + (c.a ? ' 補' : '') + (c.h ? ' ' + c.h + 'h' : '')) : '';
  const personRows = (filter) => d.persons.filter(filter).map(p => {
    const yd = p.years[1] || p.years[0]; if (!yd) return '';
    return `<tr><td class="l">${esc(p.name)}${p.rp ? ' <small>正規</small>' : ''}${p.sp ? ' <small>特別</small>' : ''}${p.fm ? ' <small>宣教</small>' : ''}${p.elder ? ' <small>長老</small>' : ''}${p.ms ? ' <small>援助</small>' : ''}<br><small class="muted">${esc(p.group || '')}</small></td>${yd.cells.map(c => '<td>' + cellTxt(c) + '</td>').join('')}<td><b>${yd.count}</b></td><td>${yd.studies || ''}</td><td>${yd.hours || ''}</td></tr>`;
  }).join('');
  const s21table = (filter) => `<div style="overflow-x:auto"><table class="v"><tr><th style="min-width:110px">氏名</th>${monthsHdr().map(m => '<th>' + m + '月</th>').join('')}<th>報告</th><th>研究</th><th>時間</th></tr>${personRows(filter)}</table></div>`;
  app.innerHTML = `
  <h1>巡回訪問 ダッシュボード</h1>
  <div class="sub">${esc(d.congregation)}　${d.sy} 奉仕年度（${ymLabel(d.asOf)} 分まで）　<span class="muted">作成 ${esc(d.generated)}${d.expires ? '／閲覧期限 ' + esc(d.expires) : ''}</span></div>
  <div class="tabs"><button class="on" data-tab="v1">全体</button><button data-tab="v2">${att ? '気にかけたい人' : '活発/不活発'}</button><button data-tab="v3">グループ</button><button data-tab="v4">S-21</button><button data-tab="v5">S-88</button></div>
  <div id="tab-v1">
    <div class="tiles">
      ${tile(y1.active, '活発な伝道者（年度平均）', dlt(y0.active, y1.active))}
      ${tile(y1.weekend, '週末集会 平均出席', dlt(y0.weekend, y1.weekend))}
      ${tile(y1.weekday, '週日集会 平均出席', dlt(y0.weekday, y1.weekday))}
      ${tile(y1.studies, '聖書研究（月平均）', dlt(y0.studies, y1.studies))}
      ${tile(d.counts.rp, '正規開拓者', '')}
      ${tile(y1.aux, '補助開拓者（月平均）', dlt(y0.aux, y1.aux))}
      ${tile(d.counts.elders + ' / ' + d.counts.ms, '長老 / 援助奉仕者', '')}
      ${tile(d.counts.inactive, '不活発な伝道者', '')}
    </div>
    <div class="card" style="margin-top:12px"><h3>活発な伝道者と集会出席の推移</h3>${lineChart([{ name: '活発な伝道者', values: d.trend.map(t => t.active), color: '#2f5d9b' }, { name: '週末出席', values: d.trend.map(t => t.weekend), color: '#1f7a3a' }, { name: '週日出席', values: d.trend.map(t => t.weekday), color: '#b26a00' }], labels)}</div>
    <div class="card"><h3>開拓者・補助開拓者・聖書研究</h3>${lineChart([{ name: '正規・特別・宣教者', values: d.trend.map(t => t.pioneers), color: '#2f5d9b' }, { name: '補助開拓者', values: d.trend.map(t => t.aux), color: '#b26a00' }, { name: '聖書研究', values: d.trend.map(t => t.studies), color: '#1f7a3a' }], labels, { zero: true })}</div>
    <div class="card"><h3>年度比較（${y0.sy} → ${y1.sy}、同じ月数で比較）</h3><table class="v"><tr><th></th><th>${y0.sy}</th><th>${y1.sy}</th><th>差</th></tr>
      ${[['活発な伝道者', 'active'], ['報告の数', 'reports'], ['週末出席', 'weekend'], ['週日出席', 'weekday'], ['聖書研究', 'studies'], ['補助開拓者', 'aux'], ['正規・特別・宣教者', 'pioneers']].map(([l, k]) => `<tr><td class="l">${l}</td><td>${y0[k] ?? '—'}</td><td>${y1[k] ?? '—'}</td><td>${dlt(y0[k], y1[k])}</td></tr>`).join('')}</table></div>
  </div>
  <div id="tab-v2" style="display:none">

    ${attBlock('不活発な伝道者', att.inactive, x => x.sy ? x.sy + '年度〜' : '')}
    <div class="ro">※ 報告の有無・研究数・時間・バプテスマ日のみから機械的に抽出した一覧です。評価ではありません。</div>` :
    `<div class="card"><h3>活発 ${d.counts.active} 名 ／ 不活発 ${d.counts.inactive} 名</h3><div class="att">${d.persons.filter(p => !p.active).map(p => `<span>${esc(p.name)} <small>${esc(p.group || '')}</small></span>`).join('') || '不活発な伝道者はいません'}</div></div>`}
  </div>
  <div id="tab-v3" style="display:none">
    <div class="card"><h3>グループ別（直近3カ月）</h3><table class="v"><tr><th>グループ</th><th>人数</th><th>開拓者</th><th>報告率</th><th></th><th>研究</th><th>時間</th></tr>
      ${d.groups.map(g => `<tr><td class="l">${esc(g.group)}</td><td>${g.members}</td><td>${g.pioneers}</td><td>${g.rate}%</td><td style="min-width:80px"><div class="bar"><i style="width:${g.rate}%"></i></div></td><td>${g.studies}</td><td>${g.hours}</td></tr>`).join('')}</table>
      <div class="muted">報告率 = 直近3カ月の（報告あり）÷（活発な成員×3）</div></div>
    <div class="card"><h3>区分別合計（${d.sy} 年度）</h3><div style="overflow-x:auto"><table class="v"><tr><th>月</th><th colspan="3">正規・特別・宣教者</th><th colspan="3">補助開拓者</th><th colspan="2">その他</th></tr><tr><th></th><th>報告</th><th>研究</th><th>時間</th><th>報告</th><th>研究</th><th>時間</th><th>報告</th><th>研究</th></tr>
      ${d.cat.map(c => `<tr><td>${ymLabel(c.ym)}</td><td>${c.pioneer.count}</td><td>${c.pioneer.studies}</td><td>${c.pioneer.hours}</td><td>${c.aux.count}</td><td>${c.aux.studies}</td><td>${c.aux.hours}</td><td>${c.other.count}</td><td>${c.other.studies}</td></tr>`).join('')}</table></div></div>
  </div>
  <div id="tab-v4" style="display:none">
    <div class="card"><h3>正規開拓者・特別開拓者・野外の宣教者（${d.sy} 年度）</h3>${s21table(p => p.active && p.cat === 'pioneer')}</div>
    <div class="card"><h3>他の全ての伝道者（グループ別）</h3>${s21table(p => p.active && p.cat === 'other')}</div>
    <div class="card"><h3>不活発な伝道者</h3>${s21table(p => !p.active)}</div>
    <div class="ro">セル: ✓=宣教を行った／数字=聖書研究／補=補助開拓／h=時間</div>
  </div>
  <div id="tab-v5" style="display:none">
    ${d.s88.map(y => `<div class="card"><h3>${y.sy} 奉仕年度</h3><table class="v"><tr><th>月</th><th>週日 回数</th><th>合計</th><th>平均</th><th>週末 回数</th><th>合計</th><th>平均</th></tr>
      ${y.months.map(m => `<tr><td>${ymLabel(m.ym)}</td><td>${m.weekday ? m.weekday.count : ''}</td><td>${m.weekday ? m.weekday.total : ''}</td><td>${m.weekday ? m.weekday.avg : ''}</td><td>${m.weekend ? m.weekend.count : ''}</td><td>${m.weekend ? m.weekend.total : ''}</td><td>${m.weekend ? m.weekend.avg : ''}</td></tr>`).join('')}</table></div>`).join('')}
  </div>
  <div class="ro">閲覧専用ページです。正式な記録は S-21／S-88 のPDFをご参照ください。</div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); ['v1', 'v2', 'v3', 'v4', 'v5'].forEach(t => $('#tab-' + t).style.display = t === b.dataset.tab ? '' : 'none'); });
}
