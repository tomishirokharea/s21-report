<style>

<body>
<div id="loading"><span class="spin"></span>処理中…</div>
<div id="sync"><span class="spin"></span>最新を確認中…</div>
<div class="wrap" id="app"></div>
<script>
// ------------------------------------------------------------
// 共通
// ------------------------------------------------------------
const Q = Object.fromEntries(new URLSearchParams(location.search));

if (Q.api) try { localStorage.setItem('s21_api', Q.api); } catch (e) {}
const TOKEN = Q.t || '';
const MODE = Q.mode || 'personal';
const app = document.getElementById('app');
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function ymLabel(ym) { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; }
function ymAdd(ym, d) { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + d; return Math.floor(t / 12) + '-' + ('0' + ((t % 12) + 1)).slice(-2); }
// 全画面の「処理中」は 0.25 秒以上かかるときだけ出す（重なった呼び出しも正しく数える）
let busyN = 0, busyTimer = null;
function loading(on) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  const el = $('#loading');
  if (busyN > 0) { if (!busyTimer && el.style.display !== 'flex') busyTimer = setTimeout(() => { busyTimer = null; if (busyN > 0) el.style.display = 'flex'; }, 250); }
  else { clearTimeout(busyTimer); busyTimer = null; el.style.display = 'none'; }
}
function syncBadge(on) { $('#sync').classList.toggle('on', !!on); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
// 読むだけの呼び出しは、通信の失敗や混雑のとき 1 回だけ自動でやり直す
const READ_ACTIONS = { me: 1, overseer: 1, secretary: 1, pioneerReview: 1, visit: 1, visitPdf: 1 };
async function call(payload, opt) {
  opt = opt || {};
  if (!API) throw new Error('接続先(api)が指定されていません。配布されたURLから開いてください。');
  const tries = (READ_ACTIONS[payload.action] || opt.retry) ? 2 : 1;
  if (!opt.quiet) loading(true);
  try {
    for (let i = 0; ; i++) {
      try {
        let res;
        try { res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ t: TOKEN }, ovSessParam(), payload)), redirect: 'follow' }); }
        catch (e) { throw Object.assign(new Error('通信できませんでした。電波の良い所でもう一度お試しください。'), { net: true, retry: true }); }
        let j;
        try { j = await res.json(); }
        catch (e) { throw Object.assign(new Error('サーバーの応答を読み取れませんでした。少し待ってからもう一度お試しください。'), { net: true, retry: true }); }
        if (!j.ok) throw Object.assign(new Error(j.error || 'エラー'), { server: true, code: j.code, retry: j.code === 'busy' });

}

// ------------------------------------------------------------
// 前回の内容を端末に覚えておき、開いた瞬間に表示 → 裏で最新を取りに行って差し替える
// （キーはトークンそのものではなく、その要約。トークンごとに分けて保存）
// ------------------------------------------------------------
const TKEY = (() => { let h = 5381; for (const c of TOKEN) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return MODE + '.' + h.toString(36); })();
const CACHE_PREFIX = 's21c:';
const CACHE_DAYS = 14;
function cacheGet(k) {
  try { const v = JSON.parse(localStorage.getItem(CACHE_PREFIX + TKEY + ':' + k) || 'null'); if (v && Date.now() - v.at < CACHE_DAYS * 864e5) return v.d; } catch (e) {}
  return null;
}
function cacheSet(k, d) {
  const s = JSON.stringify({ at: Date.now(), d });
  try { localStorage.setItem(CACHE_PREFIX + TKEY + ':' + k, s); }
  catch (e) { cachePrune(); try { localStorage.setItem(CACHE_PREFIX + TKEY + ':' + k, s); } catch (e2) {} }
}
function cacheDel(k) { try { localStorage.removeItem(CACHE_PREFIX + TKEY + ':' + k); } catch (e) {} }
function cachePrune() {
  // 容量が足りないとき: 古いものから消す
  try {
    const items = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(CACHE_PREFIX)) { let at = 0; try { at = JSON.parse(localStorage.getItem(k)).at || 0; } catch (e) {} items.push([k, at]); } }
    items.sort((a, b) => a[1] - b[1]).slice(0, Math.max(1, Math.ceil(items.length / 2))).forEach(([k]) => localStorage.removeItem(k));
  } catch (e) {}
}
function placeholder(el) { (el || app).innerHTML = '<div class="card ph"><span class="spin"></span><br>読み込み中…<small>はじめて開くときは数秒かかります</small></div>'; }
let viewGen = 0; // 月を切り替えたときなどに、古い応答で画面を上書きしないための番号

// key の前回分があればすぐ render(cached, {stale:true})、最新が届いたら render(fresh, {stale:false, changed})
async function swr(key, payload, render, opt) {
  opt = opt || {};
  const cached = cacheGet(key);
  if (cached) { syncBadge(true); render(cached, { stale: true }); }
  else if (opt.ph !== false) placeholder(opt.ph);
  let fresh;
  try { fresh = await call(payload, { quiet: true }); }
  catch (e) {
    syncBadge(false);
    // 通信できない・混雑・一時的なエラーなら、前回の内容のまま使えるようにする
    if (cached && (e.net || e.code === 'busy' || e.code === 'server')) { toast('最新の内容を確認できませんでした（前回の内容を表示中）', 'warn'); render(cached, { stale: true, failed: true }); return cached; }
    if (cached) cacheDel(key); // URL が無効になった等は、前回分も消してエラーを出す
    throw e;
  }
  syncBadge(false);
  cacheSet(key, fresh);
  if (opt.alsoKey) cacheSet(opt.alsoKey(fresh), fresh);
  render(fresh, { stale: false, changed: !cached || JSON.stringify(cached) !== JSON.stringify(fresh) });

}
function nowLabel() { const d = new Date(), p = (n) => ('0' + n).slice(-2); return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function toast(text, kind) {
  let m = $('#toast'); if (!m) { m = document.createElement('div'); m.id = 'toast'; app.prepend(m); }
  m.className = 'msg ' + (kind || 'ok'); m.textContent = text; m.style.display = 'block';
  clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 4000);
}
function showError(e) { app.innerHTML = '<div class="card"><div class="msg err">' + esc(e.message || e) + '</div></div>'; }

// ------------------------------------------------------------
// 個人用フォーム（S-4）
// ------------------------------------------------------------
let pv = null; // 表示中の個人フォーム {d, dirty}
async function renderPersonal(ym) {
  const g = ++viewGen; pv = null;
  await swr('me:' + (ym || 'cur'), { action: 'me', ym }, (d, st) => {
    if (g !== viewGen) return;
    // 入力を始めていたら、入力欄はそのままにして「提出済み」表示と履歴だけ最新にする（締切後で変更できない月なら描き直す）
    if (!st.stale && pv && pv.dirty && pv.d.ym === d.ym && !(d.report && d.report.locked)) { pv.d = d; personalMeta(d); sendReady(true); return; }
    if (st.failed && pv && pv.d.ym === d.ym) { sendReady(true); return; }
    drawPersonal(d, st.stale);

}
// 締切日の表示（ym の翌月の締切日）。例: 2026-09 → 10月5日
function deadlineLabel(ym, day) { return Number(ymAdd(ym, 1).slice(5)) + '月' + (day || 5) + '日'; }
function personalSubnote(r, d) {
  if (!r.submitted) return d && d.locked ? `<div class="msg warn">締切（${deadlineLabel(d.ym, d.deadline)}）を過ぎています。今から送ると、翌月の会衆の報告に加えられます。</div>` : '';
  const who = r.source === 'overseer' ? '監督入力' : r.source === 'import' ? '取込' : r.source === 'map' ? '区域マップ' : '本人';
  if (r.locked) return `<div class="msg warn">提出済み: ${esc(r.submitted)}（${who}）<br>締切を過ぎたため、この月の報告は変更できません。直す必要があるときは、監督か書記に伝えてください。</div>`;

  ${(d.recent || []).slice(1, 7).map(x => `<tr><td>${ymLabel(x.ym)}</td><td>${x.empty ? '—' : x.preached ? '✓' : ''}</td><td>${x.empty ? '' : x.studies || ''}</td><td>${x.empty ? '' : x.aux ? '✓' : ''}</td><td>${x.empty ? '' : x.hours || ''}</td></tr>`).join('')}</table>`; }

    <div class="row ${ro ? 'disabled' : ''}"><div class="lab">1カ月間に何らかの形で伝道したならチェックを入れてください</div><div class="chk ${r.preached ? 'on' : ''}" id="preached">${r.preached ? '✓' : ''}</div></div>
    <div class="row ${ro ? 'disabled' : ''}"><div class="lab">司会した<b>個別の</b>聖書レッスンの数</div><input type="number" id="studies" inputmode="numeric" min="0" value="${r.studies ?? ''}" ${dis}></div>

    ${p.pioneer ? `<div class="row ${ro ? 'disabled' : ''}"><div class="lab">承認された活動の時間<br><span class="muted">（LDC等。任意。報告には含まれず備考に記録）</span></div><input type="number" id="actHours" inputmode="numeric" min="0" value="${r.actHours || ''}" ${dis}></div>` : ''}

    <div class="muted" style="text-align:center;margin-top:8px">S-4-J 11/23 と同じ項目です</div>

  <div class="card"><h3>最近の報告</h3><div id="hist">${personalHist(d)}</div></div>`;

// ------------------------------------------------------------
// 監督用フォーム（全グループを1画面に。共通URL・監督個人のURL・書記のURLで開ける）
// ------------------------------------------------------------
// 開いているグループをこの端末に覚える（次に開いたとき、いつものグループが開いた状態になる）
const OV_OPEN_KEY = 's21_ov_open';
const ovOpenGet = () => { try { const a = JSON.parse(localStorage.getItem(OV_OPEN_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
const ovOpenSet = (a) => { try { localStorage.setItem(OV_OPEN_KEY, JSON.stringify(a)); } catch (e) {} };
try { localStorage.removeItem('s21_ov_by'); } catch (e) {}   // 以前の「入力する人」の記憶（使わなくなった）
const stripTag = (s) => String(s || '').replace(/\s*承認活動\s*\d+h（うち加算\s*\d+h）/g, '').replace(/\s*［加算\s*\d+h］/g, '').trim();
const isOwn = (r) => !!r && (r.source === 's4' || r.source === 'map');
let OV = null;
// 書記トークンで開いたとき（書記の修正）は、締切後の行・本人提出の行も直せる
const ovSec = () => !!(OV && OV.d && OV.d.secretary);
const ownRow = (m) => isOwn(m.report) && !ovSec();                     // 本人提出（監督は数字・備考を変えない）
const lockRow = (m) => !!(m.report && m.report.locked) && !ovSec();   // 締切後の入力済み（監督は何も変えられない）

async function renderOverseer(ym) {
  app.classList.add('ov');
  if (ym && !/^\d{4}-\d{2}$/.test(ym)) ym = undefined;
  const gen = ++viewGen;
  try {
    await swr('ov:' + (ym || 'cur'), { action: 'overseer', ym }, (d, st) => {
      if (gen !== viewGen) return;
      if (st.failed) return; // 前回の内容のまま（保存はできない状態）
      if (!st.stale && !st.changed && OV && OV.ym === d.ym) { app.classList.remove('is-stale'); return; }
      drawOverseer(d, st.stale);
    }, { alsoKey: d => 'ov:' + d.ym });
  } catch (e) {
    if (e.code !== 'pass') throw e;
    // パスワードが必要: 前回の一覧（端末の記録）を消して、パスワードを聞く
    ovForget(); OV = null;
    app.innerHTML = '<h1>野外奉仕報告　監督用</h1><div class="card muted" style="text-align:center">パスワードを入れると開きます</div>';
    ovLogin(e, () => renderOverseer(ym).catch(showError));
  }
}
// ------------------------------------------------------------
// 監督用のパスワード（数字4〜6桁。書記が決める）
//   合っていると、サーバーが「この端末の鍵」（sess）をくれる。端末に覚えておき、監督の通信に付ける
//   最後に使ってから45日（設定で変えられる）使わないと、もう一度聞かれる。書記が変えたときも
// ------------------------------------------------------------
const OV_SESS_KEY = 's21_ov_sess:' + TKEY;
function ovSessGet() { try { return localStorage.getItem(OV_SESS_KEY) || ''; } catch (e) { return ''; } }
function ovSessSet(v) { try { if (v) localStorage.setItem(OV_SESS_KEY, v); else localStorage.removeItem(OV_SESS_KEY); } catch (e) {} }
function ovSessParam() { if (MODE !== 'overseer') return {}; const s = ovSessGet(); return s ? { sess: s } : {}; }
/** 鍵と、前回の一覧（端末の記録）を消す */
function ovForget() {
  ovSessSet('');
  try { const pre = CACHE_PREFIX + TKEY + ':ov'; /* 一覧（ov:…）と会衆の様子（ovs） */ const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre)) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
let ovLoginWait = [];   // パスワードを入れたら続ける処理
function ovLogin(e, then) {
  if (then) ovLoginWait.push(then);
  if ($('#ovLogin')) return;   // もう出ている
  const box = document.createElement('div'); box.id = 'ovLogin';
  box.innerHTML = `<div class="card">
    <h3 style="margin:4px 0 6px">監督用のパスワード</h3>
    <div class="muted">${e && e.expired ? esc(e.message) + '。<br>' : ''}書記から聞いた数字（4〜6桁）を入れてください。<br>このスマホでは、最後に使ってからしばらくは聞かれません。</div>
    <input type="password" id="ovPass" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" aria-label="パスワード">
    <label class="row2"><input type="checkbox" id="ovPassShow"> 数字を見せる</label>
    <div class="msg err" id="ovPassMsg" style="display:none"></div>
    <button class="btn" id="ovPassGo">開く</button>
    <div class="muted" style="margin-top:10px">わからないときは書記に聞いてください。</div></div>`;
  document.body.appendChild(box);
  const inp = $('#ovPass'), msg = $('#ovPassMsg'), go = $('#ovPassGo');
  setTimeout(() => inp.focus(), 50);
  inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 6); msg.style.display = 'none'; };
  $('#ovPassShow').onchange = (ev) => { inp.type = ev.target.checked ? 'text' : 'password'; };
  const submit = async () => {
    const v = inp.value;
    if (!/^\d{4,6}$/.test(v)) { msg.textContent = '数字4〜6桁を入れてください'; msg.style.display = 'block'; return; }
    go.disabled = true; go.textContent = '確かめています…';
    try {
      const r = await call({ action: 'ovLogin', pass: v });
      ovSessSet(r.sess || '');
      box.remove();
      const w = ovLoginWait; ovLoginWait = []; w.forEach(f => { try { f(); } catch (er) {} });
    } catch (er) {
      msg.textContent = er.message; msg.style.display = 'block';
      if (er.code === 'badpass') { inp.value = ''; inp.focus(); }
    } finally { go.disabled = false; go.textContent = '開く'; }
  };
  go.onclick = submit;
  inp.onkeydown = (ev) => { if (ev.key === 'Enter') submit(); };
}
/** 入力・加算・月締めの途中でパスワードが必要になったとき（書記がパスワードを変えた など） */
function ovNeedPass(e, retry) { ovSessSet(''); ovLogin(e, retry); }
/** 監督画面の端末の記録を、いまの内容で更新する（次に開いたときすぐ出るように） */
function cacheOverseer() {
  if (!OV) return;
  cacheSet('ov:' + OV.ym, OV.d);
  const cur = cacheGet('ov:cur'); if (cur && cur.ym === OV.ym) cacheSet('ov:cur', OV.d);
}
function drawOverseer(d, stale) {
  // 描き直すときは、開いていたグループと「未提出の人だけ」を保つ
  const keep = OV && OV.ym === d.ym && $('#groups') ? { open: [...document.querySelectorAll('details.grp[open]')].map(x => x.dataset.group), only: !!($('#onlyUnsub') && $('#onlyUnsub').checked) } : null;
  app.classList.toggle('is-stale', !!stale);
  // 入力する人は選ばない（共通URLは監督として記録。監督個人のURLは本人、書記のURLは書記）
  const byId = d.secretary ? '' : d.me ? d.me.id : '';
  OV = { d, ym: d.ym, byId, okLocked: false };
  const opts = [ymAdd(d.ym, 1), d.ym, ymAdd(d.ym, -1), ymAdd(d.ym, -2)];
  const dl = deadlineLabel(d.ym, d.deadline);

          SQ.failed.add(key); saveMark(job.el, 'err');
          ovNeedPass(e, () => { if (!SQ.jobs.has(key)) { SQ.jobs.set(key, job); saveMark(job.el, 'wait'); } runSaves(); });
          continue;
        }
        SQ.failed.add(key); saveMark(job.el, 'err');
        toast((job.el.querySelector('.nm') ? job.el.querySelector('.nm').firstChild.textContent + '：' : '') + e.message, 'err');
      }
    }
  })().finally(() => { SQ.running = null; });
  return SQ.running;
}
async function flushSaves() { clearTimeout(SQ.timer); while (SQ.jobs.size || SQ.running) await runSaves(); }
window.addEventListener('beforeunload', (e) => { if (SQ.jobs.size || SQ.running) { e.preventDefault(); e.returnValue = ''; } });

function bindMember(m, gi) {
  const el = $('#m-' + m.id); if (!el) return;
  const f = (k) => $('[data-f=' + k + ']', el);
  const own = ownRow(m), lock = lockRow(m);
  const flash = () => { el.style.background = '#eaf6ec'; setTimeout(() => el.style.background = '', 700); };
  // 行を元の内容で描き直す（書記が確認で「キャンセル」したとき・締切後で断られたとき）。
  // 描き直しを始めたら、古い入力欄のイベント（取り外すときの blur→change など）は無視する
  let dead = false;
  const redraw = () => { if (dead) return; dead = true; setTimeout(() => { const cur = $('#m-' + m.id); if (!cur) return; cur.outerHTML = memberRow(m); bindMember(m, gi); }, 0); };
  // 書記が締切後の報告を直すときは、その画面で最初の1回だけ確かめる
  const secOk = () => {
    if (!ovSec() || !(m.report && m.report.locked) || OV.okLocked) return true;
    if (confirm('締切を過ぎた報告を直します。\n支部へ送った数字は変わりません（S-21の個人の記録に反映されます）。\nよろしいですか？')) { OV.okLocked = true; return true; }
    redraw(); return false;
  };
  const lockedFail = (e) => { if (e && e.code === 'locked') { m.report = Object.assign({}, m.report, { locked: true }); redraw(); } };
  const after = (report) => {
    m.report = report || null; el.classList.toggle('has', !!report); $('.st', el).innerHTML = rowStatus(m);   // 行を全部空にしたときは report なし＝未提出に戻る
    const w = $('.pill.soon', el); if (w) w.remove();
    updateGroupCounts(gi); flash(); cacheOverseer();
  };
  const capMsg = (res) => { if (res.capped) toast(`野外奉仕と加算時間は合わせて月${res.cap}時間までのため、加算を${res.credit ?? res.report.credit}時間にしました`, 'warn'); };
  const ym = OV.ym;
  const collect = () => {
    const payload = { action: 'overseerSubmit', by: OV.byId, id: m.id, ym,
      preached: f('preached').classList.contains('on'), studies: f('studies').value || 0,
      aux: f('aux').classList.contains('on'), hours: f('hours').value || 0, remarks: f('remarks').value };
    if (f('credit')) payload.credit = f('credit').value;
    const empty = !payload.preached && !(Number(payload.studies) > 0) && !payload.aux && !(Number(payload.hours) > 0) && !payload.remarks.trim() && !(Number(payload.credit) > 0);
    return (!m.report && empty) ? null : payload;
  };
  const save = () => {
    if (dead || own || lock) return;
    if (!collect()) return;
    if (!secOk()) return;
    queueSave('s|' + m.id + '|' + ym, async (key) => {
      const payload = collect(); if (!payload) return;
      let res;
      try { res = await call(payload, { quiet: true, retry: true }); } catch (e) { lockedFail(e); throw e; }
      if (f('credit') && !SQ.jobs.has(key)) f('credit').value = (res.report && res.report.credit) || '';   // 続けて入力していたら上書きしない
      after(res.report); capMsg(res);
    }, el);
  };
  el.querySelectorAll('.l1 .tg').forEach(t => t.onclick = () => {
    if (dead || own || lock) return;
    t.classList.toggle('on');
    if (t.dataset.f === 'aux') f('hours').disabled = !(m.pioneer || t.classList.contains('on'));
    save();
  });
  ['studies', 'hours', 'remarks'].forEach(k => f(k).onchange = save);
  if (f('credit')) f('credit').onchange = () => {
    if (dead || lock) return;
    if (!own) return save();
    queueSave('c|' + m.id + '|' + ym, async (key) => {
      let res;
      try { res = await call({ action: 'overseerCredit', by: OV.byId, id: m.id, ym, credit: f('credit').value || 0 }, { quiet: true, retry: true }); } catch (e) { lockedFail(e); throw e; }
      if (!SQ.jobs.has(key)) f('credit').value = res.credit || '';
      m.report.credit = res.credit; m.report.remarks = res.remarks;
      flash(); capMsg(res); cacheOverseer();
    }, el);
  };
}

// 巡回訪問ダッシュボード（閲覧専用）
// ------------------------------------------------------------
const chartLegend = (series) => '<div class="lgd">' + series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('') + '</div>';
const chartLabel = (l) => l.slice(2).replace('-', '/');
function lineChart(series, labels, opts) {
  // series: [{name, values:[...], color}] ; simple inline SVG
  opts = opts || {};
  const W = 600, H = 180, P = { l: 34, r: 8, t: 10, b: 24 };
  const all = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!all.length) return '<div class="muted">データなし</div>';
  let max = Math.max(...all), min = opts.zero ? 0 : Math.min(...all);
  if (max === min) { max += 1; min = Math.max(0, min - 1); }
  const x = (i) => P.l + (W - P.l - P.r) * (labels.length <= 1 ? 0 : i / (labels.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = min + (max - min) * f; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ed"/><text x="${P.l - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#6b7684">${Math.round(v)}</text>`; });
  labels.forEach((l, i) => { const last = i === labels.length - 1; if (i % Math.ceil(labels.length / 8) === 0 || last) g += `<text x="${last ? W - P.r : x(i)}" y="${H - 6}" font-size="10" text-anchor="${last ? 'end' : 'middle'}" fill="#6b7684">${chartLabel(l)}</text>`; });
  series.forEach(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.values.forEach((v, i) => { if (v !== null && v !== undefined) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`; });
  });
  // 月ごとの当たり判定（触れると値が出る）
  const slot = (W - P.l - P.r) / Math.max(1, labels.length - 1);
  labels.forEach((l, i) => { const vals = series.filter(s => s.values[i] !== null && s.values[i] !== undefined); if (!vals.length) return; g += `<rect x="${(x(i) - slot / 2).toFixed(1)}" y="${P.t}" width="${slot.toFixed(1)}" height="${H - P.t - P.b}" fill="transparent"><title>${ymLabel(l)}\n${vals.map(s => s.name + ' ' + s.values[i] + (opts.unit || '')).join('\n')}</title></rect>`; });
  return chartLegend(series) + `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/** 積み上げ棒グラフ（下から series の順に積む）。棒の高さ＝合計 */
function stackChart(series, labels) {
  const W = 600, H = 190, P = { l: 34, r: 8, t: 16, b: 24 };
  const n = labels.length;
  const tot = labels.map((_, i) => series.some(s => s.values[i] !== null && s.values[i] !== undefined) ? series.reduce((a, s) => a + (s.values[i] || 0), 0) : null);
  const all = tot.filter(v => v !== null);
  if (!all.length) return '<div class="muted">データなし</div>';
  const raw = Math.max(...all, 1), step = raw <= 10 ? 2 : raw <= 40 ? 5 : raw <= 100 ? 10 : 20, max = Math.ceil(raw / step) * step;
  const slot = (W - P.l - P.r) / n, bw = Math.max(4, Math.min(16, slot * 0.62));
  const x = (i) => P.l + slot * i + slot / 2;

  const d = VIS, p = d.persons[i]; if (!p) return;
  const yrs = p.years.map((yd, k) => ({ yd, sy: d.sy - 1 + k })).filter(x => x.yd).reverse();
  const yearTable = ({ yd, sy }) => `<h4>${sy} 奉仕年度</h4><table class="s21m"><colgroup><col style="width:38px"><col style="width:46px"><col style="width:52px"><col style="width:38px"><col style="width:42px"><col></colgroup><tr><th>月</th><th>宣教を<br>行った</th><th>聖書<br>レッスン</th><th>補助<br>開拓</th><th>時間</th><th>備考</th></tr>
    ${syMonths(sy, d.startM).map((ym, k) => { const c = yd.cells[k]; return `<tr class="${ym > d.asOf ? 'fut' : ''}"><td>${Number(ym.slice(5))}月</td><td>${c ? (c.p ? '✓' : '－') : ''}</td><td>${c && c.s ? c.s : ''}</td><td>${c && c.a ? '✓' : ''}</td><td>${c && c.h ? c.h : ''}</td><td class="rm">${c && c.m ? esc(c.m) : ''}</td></tr>`; }).join('')}
    <tr class="tot"><td>合計</td><td>${yd.count}</td><td>${yd.studies || ''}</td><td></td><td>${yd.hours || ''}</td><td></td></tr></table>`;
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
    <div class="sh-top"><div><b class="sh-n">${esc(p.name)}</b>${ptags(p)}<div class="muted">${[p.group || '', p.baptism ? 'バプテスマ ' + p.baptism : '', p.active ? (p.cat === 'pioneer' ? '活発①' : '活発②') : '不活発'].filter(Boolean).map(esc).join('　')}</div></div><button class="sh-x" aria-label="閉じる">×</button></div>
    ${!p.active ? `<div class="msg warn" style="margin-top:0">最後の報告 ${p.lastYm ? ymLabel(p.lastYm) + (p.last ? '（' + esc(lastTxt(p.last)) + '）' : '') : 'なし'}<br>最後に伝道 ${p.lastPreachedYm ? ymLabel(p.lastPreachedYm) : 'なし'}　／　不活発になった年度 ${p.inactiveSy ? esc(p.inactiveSy) : '—'}</div>` : ''}
    ${yrs.length ? yrs.map(yearTable).join('') : p.original ? `<div class="muted">この仕組みには月ごとの記録がありません。${origTxt(p)}</div>` : '<div class="muted">保管期間内の記録はありません</div>'}
  </div>`;
  document.body.appendChild(bg); document.body.style.overflow = 'hidden';
  const close = () => { bg.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', esc1); };
  const esc1 = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc1);
  bg.onclick = (e) => { if (e.target === bg) close(); };
  $('.sh-x', bg).onclick = close;
}

// ---- 正式なPDF（書記が作成したもの）のダウンロード
function pdfFile(key) { const s = VIS && VIS.pdfs; return s && s.files ? s.files.find(f => f.key === key) : null; }
function pdfBtn(key) {
  const f = pdfFile(key);
  if (!f || f.missing) return '<span class="pdfx muted">PDF未作成</span>';
  if (f.empty) return '<span class="pdfx muted">PDF：該当なし</span>';
  const unknown = (f.parts || []).some(x => !x.pages);
  return `<button class="pdfb" data-pdf="${key}">PDF<small>${unknown ? (f.parts || []).length + 'ファイル分' : f.pages + 'ページ'}</small></button>`;
}
function pdfCardHtml(d) {
  const s = d.pdfs;
  if (!s || !s.ready) return `<div class="card pdfc"><h3>正式な記録（PDF）</h3><div class="muted">まだ作成されていません。書記が作成すると、ここからダウンロードできます。</div></div>`;
  const files = s.files.filter(f => !f.missing && !f.empty), pages = files.reduce((a, f) => a + (f.pages || 0), 0);
  const unknown = files.some(f => (f.parts || []).some(x => !x.pages));
  const changed = [s.newer ? '報告が ' + s.newer + ' 件追加・変更' : '', s.aggregatedAfter ? '月次集計（活発／不活発の判定）' : ''].filter(Boolean).join('、');
  return `<div class="card pdfc"><h3>正式な記録（PDF）</h3>
    <div class="muted">S-21（公式様式・1人1ページ）と S-88　${s.years.map(esc).join('・')} 奉仕年度　作成 ${esc(s.generated)}</div>
    ${changed ? `<div class="msg warn">PDFの作成後に、${changed}がありました。この画面の表は最新ですが、PDFは作成時点の内容です。</div>` : ''}
    ${s.missing ? '<div class="msg warn">一部のPDFがまだ作成されていません。</div>' : ''}
    ${files.some(f => f.missingOriginals) ? '<div class="msg warn">不活発な人の元のS-21が取込フォルダに見つからなかった人がいます（空のS-21にしています）。</div>' : ''}
    <button class="btn" id="pdfAll">まとめて1つのPDFで保存<small>（${unknown ? '' : '全 ' + pages + ' ページ・'}綴じる順）</small></button>
    <details class="pdfl"><summary>ファイルごとに保存</summary>${s.files.map(f => `<div class="pf"><span>${esc(f.label)}</span>${pdfBtn(f.key)}</div>`).join('')}</details>
  </div>`;
}
const PDFQ = {};
function b64bytes(b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
/**
 * 区分のPDFを取る。不活発は「作ったS-21」と「元のS-21（取り込んだPDFのコピー）」の複数のファイルなので、
 * 1つずつ取ってこの端末で綴じる順（ローマ字順）に1つにまとめる
 */
function fetchPdf(key) {
  const f = pdfFile(key), k = key + '|' + (f ? f.generated : '');
  if (!PDFQ[k]) PDFQ[k] = (async () => {
    const n = f && f.parts ? f.parts.length : 1;
    if (n <= 1 && !(f && f.order)) { const r = await call({ action: 'visitPdf', key }, { quiet: true }); return { name: r.name, bytes: b64bytes(r.data) }; }
    const raw = [];
    for (let i = 0; i < n; i++) { const r = await call({ action: 'visitPdf', key, part: i }, { quiet: true }); raw.push(b64bytes(r.data)); }
    const { PDFDocument } = await loadPdfLib();
    const out = await PDFDocument.create(), docs = [], bad = [];
    for (const it of (f.order || raw.map((_, i) => ({ i, p: null })))) {
      if (!(it.i >= 0) || !raw[it.i]) continue;
      try {
        const src = docs[it.i] || (docs[it.i] = await PDFDocument.load(raw[it.i], { ignoreEncryption: true }));
        (await out.copyPages(src, it.p || src.getPageIndices())).forEach(pg => out.addPage(pg));
      } catch (e) { bad.push((f.parts[it.i] || {}).person || (f.parts[it.i] || {}).name || it.i); }
    }
    if (bad.length) toast('次の元のS-21をまとめられませんでした: ' + bad.join('・') + '（書記の出力フォルダにあります）', 'warn');
    return { name: f.name, bytes: await out.save() };
  })().catch(e => { delete PDFQ[k]; throw e; });
  return PDFQ[k];
}
/** 保存する。自動で始まらない端末のために、押せる保存リンクもボタンの下に出す */
function saveBytes(bytes, name, near) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  const at = near.closest('.fhead') || near;   // 見出しの横ではなく下に出す
  let link = at.nextElementSibling && at.nextElementSibling.matches('a.pdfget') ? at.nextElementSibling : null;
  if (!link) { link = document.createElement('a'); link.className = 'pdfget'; at.insertAdjacentElement('afterend', link); }
  link.href = url; link.download = name; link.textContent = '⤓ ' + name + '（保存が始まらないときはここを押す）';
}
function bindPdfButtons(root) {
  root.querySelectorAll('button.pdfb').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const orig = b.innerHTML; b.disabled = true; b.innerHTML = '準備中…';
    try { const r = await fetchPdf(b.dataset.pdf); saveBytes(r.bytes, r.name, b); }
    catch (er) { toast(er.message, 'err'); }
    finally { b.disabled = false; b.innerHTML = orig; }
  });
}
async function loadPdfLib() {
  if (window.PDFLib) return window.PDFLib;
  for (const src of ['https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js']) {
    try { await new Promise((ok, ng) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = ng; document.head.appendChild(sc); }); if (window.PDFLib) return window.PDFLib; } catch (e) {}
  }
  throw new Error('PDFをまとめる部品を読み込めませんでした。「ファイルごとに保存」をお使いください。');
}
/** 区分ごとのPDFを順に取り、この端末で1つにまとめて保存（綴じる順: ①→②→不活発→区分別合計→S-88） */
async function downloadAllPdfs(btn) {
  const s = VIS.pdfs, files = s.files.filter(f => !f.missing && !f.empty);
  const orig = btn.innerHTML; btn.disabled = true;
  try {
    const lib = loadPdfLib();
    const parts = [];
    for (let i = 0; i < files.length; i++) { btn.innerHTML = `準備中… ${i + 1} / ${files.length}`; parts.push(await fetchPdf(files[i].key)); }
    btn.innerHTML = '1つにまとめています…';
    const { PDFDocument } = await lib;
    const out = await PDFDocument.create();
    for (const p of parts) { const src = await PDFDocument.load(p.bytes); (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg)); }
    out.setTitle(VIS.congregation + ' S-21・S-88 ' + s.years.join('・') + '奉仕年度');
    saveBytes(await out.save(), 'S-21・S-88_' + VIS.congregation + '_' + s.years.join('-') + '.pdf', btn);
  } catch (e) { toast(e.message, 'err'); }
  finally { btn.disabled = false; btn.innerHTML = orig; }
}
