<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>野外奉仕報告</title>
<style>
  :root { --blue:#2f5d9b; --navy:#1b3a63; --line:#d7dde6; --bg:#f4f6f9; --gray:#6b7684; --ok:#1f7a3a; --warn:#b26a00; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; color:#1f2a37; font-size:16px; line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:16px 14px 60px; }
  .wide { max-width:900px; }
  h1 { font-size:20px; margin:4px 0 10px; text-align:center; }
  .sub { text-align:center; color:var(--gray); font-size:13px; margin-bottom:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; border:1px solid #333; padding:10px 12px; margin-top:-1px; background:#fff; }
  .row .lab { flex:1; font-size:15px; }
  .row input[type=number] { width:64px; height:40px; font-size:18px; text-align:center; border:1px solid #333; border-radius:4px; }
  .row.disabled { color:#aaa; }
  .field { display:flex; align-items:baseline; gap:8px; margin:4px 0 8px; }
  .field b { white-space:nowrap; }
  .field .v { flex:1; border-bottom:1px dotted #333; padding:2px 4px; font-size:17px; }
  select, input[type=text], textarea { width:100%; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:6px; }
  textarea { height:72px; }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:14px; font-size:17px; font-weight:bold; margin-top:12px; cursor:pointer; }
  .btn.sec { background:#e9eff7; color:var(--navy); }
  .btn.sm { display:inline-block; width:auto; padding:8px 14px; font-size:14px; margin:4px 4px 0 0; }
  .btn:disabled { opacity:.5; }
  .chk { width:44px; height:44px; border:2px solid #333; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; user-select:none; background:#fff; flex-shrink:0; }
  .chk.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .tg { width:46px; height:28px; border-radius:14px; background:#c9d3e0; position:relative; cursor:pointer; flex-shrink:0; }
  .tg::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  .tg.on { background:var(--blue); } .tg.on::after { left:21px; }
  .msg { padding:10px 12px; border-radius:8px; margin:10px 0; font-size:14px; }
  .msg.ok { background:#eaf6ec; color:var(--ok); } .msg.err { background:#fdecea; color:var(--err); } .msg.warn { background:#fff5e0; color:var(--warn); }
  .muted { color:var(--gray); font-size:13px; }
  .hist { width:100%; border-collapse:collapse; font-size:13px; }
  .hist td, .hist th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:center; }
  /* overseer list */
  .mem { display:grid; grid-template-columns:1fr 46px 56px 46px 56px; gap:6px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line); }
  .mem.head { font-size:11px; color:var(--gray); border-bottom:2px solid var(--blue); padding:4px; }
  .mem.head span { text-align:center; } .mem.head span:first-child { text-align:left; }
  .mem .nm { font-size:15px; overflow:hidden; line-height:1.3; }
  .mem.done { background:#f3f5f8; color:#9aa5b5; } .mem.done .tg { opacity:.5; pointer-events:none; } .mem.done input { color:#9aa5b5; }
  .mem.inactive { color:#b5bcc8; }
  .mem input { width:100%; height:38px; font-size:16px; text-align:center; border:1px solid #9aa5b5; border-radius:5px; }
  .pill { display:inline-block; font-size:10px; background:#e9eff7; color:var(--navy); border-radius:8px; padding:0 6px; margin-left:4px; vertical-align:middle; }
  .pill.warn { background:#fff5e0; color:var(--warn); }
  .memo-btn { font-size:11px; color:var(--blue); background:none; border:none; padding:0; }
  /* secretary */
  .sec-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px) { .sec-grid { grid-template-columns:1fr; } }
  .kv { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .kv .k { flex:1; color:#4a5566; font-size:14px; }
  .kv .v { min-width:70px; text-align:right; font-weight:bold; font-size:18px; border:1px solid #9aa5b5; border-radius:5px; padding:4px 8px; background:#f8fafc; }
  .kv .cp { font-size:12px; border:1px solid var(--blue); color:var(--blue); background:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; }
  .kv .cp.done { background:var(--blue); color:#fff; }
  h3 { font-size:15px; color:var(--navy); margin:0 0 6px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:14px; }
  .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .credit input { width:70px; height:36px; font-size:16px; text-align:center; }
  code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:13px; }
  /* visit dashboard */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .tile .n { font-size:24px; font-weight:bold; color:var(--navy); line-height:1.1; }
  .tile .l { font-size:12px; color:var(--gray); }
  .tile .d { font-size:12px; } .up { color:var(--ok); } .down { color:var(--err); }
  .chart { width:100%; height:auto; }
  .att { display:flex; flex-wrap:wrap; gap:6px; }
  .att span { background:#eef1f5; border-radius:14px; padding:4px 10px; font-size:14px; }
  .att span small { color:var(--gray); }
  table.v { width:100%; border-collapse:collapse; font-size:12px; }
  table.v th, table.v td { border:1px solid var(--line); padding:3px 4px; text-align:center; white-space:nowrap; }
  table.v th { background:#e9eff7; }
  table.v td.l { text-align:left; }
  .bar { height:8px; background:#e9eff7; border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--blue); }
  details { margin:6px 0; } summary { cursor:pointer; font-weight:bold; color:var(--navy); }
  .ro { font-size:12px; color:var(--gray); text-align:center; margin:8px 0; }
  @media print { .noprint, .tabs, h1, .sub, #toast { display:none !important; } body { background:#fff; } .card { border:none; } #tab-pioneer { display:block !important; } #tab-hub, #tab-check, #tab-pdf, #tab-setup { display:none !important; } }
  #loading { position:fixed; inset:0; background:rgba(255,255,255,.6); display:none; align-items:center; justify-content:center; font-weight:bold; color:var(--navy); }
</style>
</head>
<body>
<div id="loading">読み込み中…</div>
<div class="wrap" id="app"></div>
<script>
// ------------------------------------------------------------
// 共通
// ------------------------------------------------------------
const Q = Object.fromEntries(new URLSearchParams(location.search));
let API = Q.api || localStorage.getItem('s21_api') || '';
if (Q.api) try { localStorage.setItem('s21_api', Q.api); } catch (e) {}
const TOKEN = Q.t || '';
const MODE = Q.mode || 'personal';
const app = document.getElementById('app');
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function ymLabel(ym) { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; }
function ymAdd(ym, d) { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + d; return Math.floor(t / 12) + '-' + ('0' + ((t % 12) + 1)).slice(-2); }
function loading(on) { $('#loading').style.display = on ? 'flex' : 'none'; }
async function call(payload) {
  if (!API) throw new Error('接続先(api)が指定されていません。配布されたURLから開いてください。');
  loading(true);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ t: TOKEN }, payload)), redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j;
  } finally { loading(false); }
}
function toast(text, kind) {
  let m = $('#toast'); if (!m) { m = document.createElement('div'); m.id = 'toast'; app.prepend(m); }
  m.className = 'msg ' + (kind || 'ok'); m.textContent = text; m.style.display = 'block';
  clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 4000);
}
function showError(e) { app.innerHTML = '<div class="card"><div class="msg err">' + esc(e.message || e) + '</div></div>'; }

// ------------------------------------------------------------
// 個人用フォーム（S-4）
// ------------------------------------------------------------
async function renderPersonal(ym) {
  const d = await call({ action: 'me', ym });
  const p = d.person, r = d.report || {};
  const opts = []; for (let i = 0; i < 4; i++) { const y = ymAdd(d.ym, 1 - i); opts.push(y); }
  if (!opts.includes(d.ym)) opts.unshift(d.ym);
  app.innerHTML = `
  <h1>野外奉仕報告</h1>
  <div class="sub">${esc(d.congregation)}</div>
  <div class="card">
    <div class="field"><b>氏名:</b><div class="v">${esc(p.name)}</div></div>
    <div class="field"><b>月:</b><div class="v" style="border:none;padding:0"><select id="ym">${opts.map(y => `<option value="${y}" ${y === d.ym ? 'selected' : ''}>${ymLabel(y)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="lab">1カ月間に何らかの形で伝道したならチェックを入れてください</div><div class="chk ${r.preached ? 'on' : ''}" id="preached">${r.preached ? '✓' : ''}</div></div>
    <div class="row"><div class="lab">司会した<b>個別の</b>聖書研究の数</div><input type="number" id="studies" inputmode="numeric" min="0" value="${r.studies ?? ''}"></div>
    <div class="row ${p.pioneer ? '' : ''}"><div class="lab">補助開拓者として奉仕した</div><div class="tg ${r.aux ? 'on' : ''}" id="aux"></div></div>
    <div class="row ${p.pioneer || r.aux ? '' : 'disabled'}" id="hoursRow"><div class="lab">時間<br><span class="muted">（補助開拓者, 正規開拓者, 特別開拓者, 野外の宣教者は記入してください）</span></div><input type="number" id="hours" inputmode="numeric" min="0" value="${r.hours || ''}" ${p.pioneer || r.aux ? '' : 'disabled'}></div>
    ${p.pioneer ? `<div class="row"><div class="lab">承認された活動の時間<br><span class="muted">（LDC等。任意。報告には含まれず備考に記録）</span></div><input type="number" id="actHours" inputmode="numeric" min="0" value="${r.actHours || ''}"></div>` : ''}
    <div class="row" style="display:block"><div class="lab">備考:</div><textarea id="remarks">${esc(r.remarks || '')}</textarea></div>
    ${r.submitted ? `<div class="muted" style="margin-top:8px">提出済み: ${esc(r.submitted)}（${r.source === 'overseer' ? '監督入力' : r.source === 'import' ? '取込' : '本人'}）。送信すると上書きされます。</div>` : ''}
    <button class="btn" id="send">送信</button>
    <div class="muted" style="text-align:center;margin-top:8px">S-4-J 11/23 と同じ項目です</div>
  </div>
  <div class="card"><h3>最近の報告</h3><table class="hist"><tr><th>月</th><th>伝道</th><th>研究</th><th>補助</th><th>時間</th></tr>
  ${d.recent.slice(1, 7).map(x => `<tr><td>${ymLabel(x.ym)}</td><td>${x.empty ? '—' : x.preached ? '✓' : ''}</td><td>${x.empty ? '' : x.studies || ''}</td><td>${x.empty ? '' : x.aux ? '✓' : ''}</td><td>${x.empty ? '' : x.hours || ''}</td></tr>`).join('')}</table></div>`;
  $('#ym').onchange = (e) => renderPersonal(e.target.value);
  $('#preached').onclick = (e) => { e.target.classList.toggle('on'); e.target.textContent = e.target.classList.contains('on') ? '✓' : ''; };
  $('#aux').onclick = (e) => { e.target.classList.toggle('on'); const on = e.target.classList.contains('on') || p.pioneer; $('#hours').disabled = !on; $('#hoursRow').classList.toggle('disabled', !on); };
  $('#send').onclick = async () => {
    const payload = { action: 'submit', ym: $('#ym').value, preached: $('#preached').classList.contains('on'), studies: $('#studies').value || 0, aux: $('#aux').classList.contains('on'), hours: $('#hours').value || 0, actHours: ($('#actHours') || {}).value || 0, remarks: $('#remarks').value, source: 's4' };
    if (!payload.preached && !(Number(payload.hours) > 0) && !(Number(payload.studies) > 0)) { if (!confirm('「伝道した」にチェックがありません。このまま送信しますか？')) return; }
    try { const res = await call(payload); await renderPersonal(payload.ym); toast(ymLabel(payload.ym) + ' の報告を送信しました' + (res.late ? '（締切後のため翌月の会衆報告に加算されます）' : ''), res.late ? 'warn' : 'ok'); }
    catch (e) { toast(e.message, 'err'); }
  };
}

// ------------------------------------------------------------
// 監督用フォーム
// ------------------------------------------------------------
async function renderOverseer(ym) {
  const d = await call({ action: 'overseer', ym });
  const opts = [ymAdd(d.ym, 1), d.ym, ymAdd(d.ym, -1), ymAdd(d.ym, -2)];
  app.innerHTML = `
  <h1>${esc(d.group)}</h1>
  <div class="sub">${esc(d.congregation)}　監督: ${esc(d.overseer.name)}</div>
  <div class="card">
    <select id="ym">${opts.map(y => `<option value="${y}" ${y === d.ym ? 'selected' : ''}>${ymLabel(y)}</option>`).join('')}</select>
    <div style="height:10px"></div>
    <div class="mem head"><span>氏名</span><span>伝道</span><span>研究</span><span>補助</span><span>時間</span></div>
    ${d.members.map(m => memberRow(m)).join('')}
    <div class="msg warn" id="unsub">未提出 <b>${d.unsubmitted.length}名</b>${d.unsubmitted.length ? '（' + d.unsubmitted.map(esc).join('・') + '）' : ''}</div>
    <div class="muted">1行入力するごとに自動保存されます。本人がWEB提出した行（グレー）は上書きできません。</div>
    <button class="btn" id="close">月締め完了</button>
  </div>`;
  $('#ym').onchange = (e) => renderOverseer(e.target.value);
  $('#close').onclick = async () => { await call({ action: 'closeMonth', ym: d.ym }); toast('月締めを記録しました'); };
  d.members.forEach(m => bindMember(m, d.ym));
}
function memberRow(m) {
  const r = m.report || {};
  const own = r.source === 's4' || r.source === 'map';
  const cls = own ? 'done' : !m.active ? 'inactive' : '';
  const warn = m.active && !own && m.monthsWithout >= 4 ? `<span class="pill warn">${6 - m.monthsWithout}カ月で不活発</span>` : '';
  return `<div class="mem ${cls}" id="m-${m.id}">
    <div class="nm">${esc(m.name)}${own ? '<span class="pill">提出済</span>' : !m.active ? '<span class="pill">不活発</span>' : ''}${warn}<br><button class="memo-btn" data-memo="${m.id}">備考${r.remarks ? '✎' : ''}</button></div>
    <div class="tg ${r.preached ? 'on' : ''}" data-f="preached"></div>
    <input type="number" inputmode="numeric" data-f="studies" value="${r.studies ?? ''}" ${own ? 'disabled' : ''}>
    <div class="tg ${r.aux ? 'on' : ''}" data-f="aux"></div>
    <input type="number" inputmode="numeric" data-f="hours" value="${r.hours || ''}" ${own || !(m.pioneer || r.aux) ? 'disabled' : ''}>
  </div>`;
}
function bindMember(m, ym) {
  const el = $('#m-' + m.id); if (!el) return;
  let remarks = (m.report && m.report.remarks) || '';
  const own = m.report && (m.report.source === 's4' || m.report.source === 'map');
  const save = async () => {
    if (own) return;
    const payload = { action: 'overseerSubmit', id: m.id, ym,
      preached: $('[data-f=preached]', el).classList.contains('on'), studies: $('[data-f=studies]', el).value || 0,
      aux: $('[data-f=aux]', el).classList.contains('on'), hours: $('[data-f=hours]', el).value || 0, remarks };
    try { await call(payload); el.style.background = '#eaf6ec'; setTimeout(() => el.style.background = '', 600); }
    catch (e) { toast(e.message, 'err'); }
  };
  el.querySelectorAll('.tg').forEach(t => t.onclick = () => { if (own) return; t.classList.toggle('on'); if (t.dataset.f === 'aux') { $('[data-f=hours]', el).disabled = !(m.pioneer || t.classList.contains('on')); } save(); });
  el.querySelectorAll('input').forEach(i => i.onchange = save);
  $('[data-memo]', el).onclick = () => { const v = prompt(m.name + ' の備考', remarks); if (v !== null) { remarks = v; save(); } };
}

// ------------------------------------------------------------
// 書記用 月次画面
// ------------------------------------------------------------
async function renderSecretary(ym) {
  app.classList.add('wide');
  const d = await call({ action: 'secretary', ym });
  const opts = []; for (let i = -1; i < 13; i++) opts.push(ymAdd(d.ym, -i + 0)); const sel = [...new Set([ymAdd(d.ym, 1), ...opts])];
  const kv = (k, v, note) => `<div class="kv"><div class="k">${k}${note ? '<br><span class="muted">' + note + '</span>' : ''}</div><div class="v">${v ?? '—'}</div><button class="cp" data-v="${v ?? ''}">コピー</button></div>`;
  const we = d.attendance.weekend, wd = d.attendance.weekday;
  app.innerHTML = `
  <h1>書記用 月次提出画面</h1>
  <div class="sub">${esc(d.congregation)}　<select id="ym" style="width:auto;display:inline-block">${sel.map(y => `<option value="${y}" ${y === d.ym ? 'selected' : ''}>${ymLabel(y)}分</option>`).join('')}</select></div>
  <div class="tabs"><button class="on" data-tab="hub">hub入力</button><button data-tab="check">確認事項</button><button data-tab="pioneer">開拓者の確認</button><button data-tab="pdf">巡回訪問PDF</button><button data-tab="setup">初期設定</button></div>
  <div id="tab-hub">
    <div class="msg ${d.storedAt ? 'ok' : 'warn'}">${d.storedAt ? '自動集計済み: ' + esc(d.storedAt) : 'この月はまだ自動集計されていません（下の数字は現時点の暫定値）'}　<button class="btn sm sec" id="agg">今すぐ集計して確定</button></div>
    <div class="sec-grid">
      <div>
        <div class="card"><h3>活発な伝道者全員</h3>${kv('過去6カ月に報告あり', d.hub.activeCount)}</div>
        <div class="card"><h3>週末の集会の平均出席者数</h3>${kv('S-88より', d.hub.weekendAvg, we ? we.count + '回・合計 ' + we.total : '出席データなし')}</div>
        <div class="card"><h3>伝道者</h3>${kv('報告の数', d.hub.publishers.count)}${kv('聖書研究', d.hub.publishers.studies)}</div>
      </div>
      <div>
        <div class="card"><h3>補助開拓者</h3>${kv('報告の数', d.hub.aux.count)}${kv('時間', d.hub.aux.hours)}${kv('聖書研究', d.hub.aux.studies)}</div>
        <div class="card"><h3>正規開拓者</h3>${kv('報告の数', d.hub.rp.count)}${kv('時間', d.hub.rp.hours)}${kv('聖書研究', d.hub.rp.studies)}</div>
      </div>
    </div>
    <div class="muted">※ 遅延提出 ${d.lateCount} 件を加算済み ／ 特別開拓者・野外の宣教者は除外 ／ 加算時間 ${d.credit}h は報告に含めず ／ 週日集会: ${wd ? wd.count + '回・平均 ' + wd.avg : '—'}</div>
    <a class="btn" href="https://hub.jw.org" target="_blank" style="text-align:center;text-decoration:none">hub.jw.org を開く</a>
  </div>
  <div id="tab-check" style="display:none">
    <div class="card"><h3>未提出（活発な伝道者）: ${d.unsubmitted.length}名</h3><div>${d.unsubmitted.map(u => esc(u.name) + '<span class="pill">' + esc(u.group) + '</span>').join('　') || 'なし'}</div></div>
    <div class="card"><h3>活発／不活発の変化</h3><div>不活発になった: ${d.changes.toInactive.map(esc).join('・') || 'なし'}</div><div>活発に復帰: ${d.changes.toActive.map(esc).join('・') || 'なし'}</div><div class="muted">「今すぐ集計」でマスタに反映されます</div></div>
    <div class="card credit"><h3>承認された活動の時間（加算時間の確定）</h3>
      ${d.creditRows.length ? d.creditRows.map(c => `<div class="kv"><div class="k">${esc(c.name)}（${ymLabel(c.ym)}）<br><span class="muted">野外奉仕 ${c.hours}h ／ 承認活動 ${c.actHours}h</span></div>加算 <input type="number" value="${c.credit || ''}" data-id="${c.id}" data-ym="${c.ym}"> h <button class="btn sm sec" data-credit="${c.id}|${c.ym}">確定</button></div>`).join('') : '<div class="muted">該当なし</div>'}
      <div class="muted">確定すると備考に「承認活動 X時間（うち加算 Y時間）」が記録されます。加算時間はS-236の基準で判断してください。報告の数字には含まれません。</div></div>
  </div>
  <div id="tab-pioneer" style="display:none">

function initPioneer(curYm) {
  const sel = $('#prTo'); const opts = []; for (let i = 0; i < 24; i++) opts.push(ymAdd(curYm, -i));
  sel.innerHTML = opts.map(y => `<option value="${y}">${ymLabel(y)}</option>`).join('');
  const sy = (ym) => { const [y, m] = ym.split('-').map(Number); return m >= 9 ? y + 1 : y; };
  // 「3月」「7月」ボタン：まだ来ていない期間なら前の年度を見る
  const pick = (m) => { let y = sy(curYm); let t = y + '-' + ('0' + m).slice(-2); if (t > curYm) t = (y - 1) + '-' + ('0' + m).slice(-2); return t; };
  document.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => showPioneer(b.dataset.pr === 'mar' ? pick(2) : pick(7)));
  $('#prGo').onclick = () => showPioneer(sel.value);
}
async function showPioneer(toYm) {

    };
    out.innerHTML = `
    <div class="card">

      <div style="overflow-x:auto"><table class="v">
        <tr><th style="min-width:110px">氏名</th>${mh}<th>野外奉仕</th><th>加算</th><th>合計</th><th>月数</th><th>月平均</th><th>不足</th>${d.remainingMonths ? '<th>残り月の目安</th>' : ''}</tr>
        ${d.rows.map(r => `<tr style="${r.short ? 'background:#fff5e0' : ''}">
          <td class="l">${r.short ? '⚠ ' : ''}${esc(r.name)}<br><small class="muted">${esc(r.group || '')}${r.midYear ? '・' + ymLabel(r.from) + '〜' : ''}</small></td>
          ${r.monthly.map(m => cell(m, r)).join('')}
          ${r.notStarted ? `<td colspan="6" class="muted">期間内に開拓者としての時間の報告なし</td>` : `<td>${r.hours}</td><td>${r.credit || ''}</td><td><b>${r.total}</b></td><td>${r.months}</td>

// 巡回訪問ダッシュボード（閲覧専用）

function lineChart(series, labels, opts) {
  // series: [{name, values:[...], color}] ; simple inline SVG
  const W = 600, H = 180, P = { l: 34, r: 8, t: 10, b: 24 };
  const all = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!all.length) return '<div class="muted">データなし</div>';
  let max = Math.max(...all), min = (opts && opts.zero) ? 0 : Math.min(...all);
  if (max === min) { max += 1; min = Math.max(0, min - 1); }
  const x = (i) => P.l + (W - P.l - P.r) * (labels.length <= 1 ? 0 : i / (labels.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = min + (max - min) * f; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ed"/><text x="${P.l - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#6b7684">${Math.round(v)}</text>`; });
  labels.forEach((l, i) => { if (i % Math.ceil(labels.length / 8) === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#6b7684">${l.slice(2).replace('-', '/')}</text>`; });
  series.forEach(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.values.forEach((v, i) => { if (v !== null && v !== undefined) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${s.color}"/>`; });
  });
  const legend = series.map(s => `<span style="color:${s.color};font-size:12px;margin-right:10px">● ${esc(s.name)}</span>`).join('');
  return `<div>${legend}</div><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function dlt(a, b, unit) { if (a === null || b === null || a === undefined || b === undefined) return ''; const d = Math.round((b - a) * 10) / 10; return `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}${unit || ''}</span>`; }

      ${y.months.map(m => `<tr><td>${ymLabel(m.ym)}</td><td>${m.weekday ? m.weekday.count : ''}</td><td>${m.weekday ? m.weekday.total : ''}</td><td>${m.weekday ? m.weekday.avg : ''}</td><td>${m.weekend ? m.weekend.count : ''}</td><td>${m.weekend ? m.weekend.total : ''}</td><td>${m.weekend ? m.weekend.avg : ''}</td></tr>`).join('')}</table></div>`).join('')}
  </div>
  <div class="ro">閲覧専用ページです。正式な記録は S-21／S-88 のPDFをご参照ください。</div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); ['v1', 'v2', 'v3', 'v4', 'v5'].forEach(t => $('#tab-' + t).style.display = t === b.dataset.tab ? '' : 'none'); });
}

// ------------------------------------------------------------
(async () => {
  try {
    if (!TOKEN) throw new Error('このページは配布された専用URLから開いてください。');
    if (MODE === 'overseer') await renderOverseer();
    else if (MODE === 'visit') await renderVisit();
    else if (MODE === 'secretary') await renderSecretary();
    else await renderPersonal();
  } catch (e) { showError(e); }
})();
</script>
